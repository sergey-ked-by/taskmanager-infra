# This workflow defines the Continuous Deployment (CD) pipeline for the infrastructure.
name: Deploy Infrastructure

on:
  # Triggers the workflow on push events to the main branch.
  push:
    branches:
      - main
  # Allows this workflow to be triggered by the 'deploy-staging' event from the application repo.
  repository_dispatch:
    types: [deploy-staging]
  # Allows this workflow to be run manually from the GitHub Actions UI.
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    # These permissions are needed for secure authentication with Azure.
    permissions:
      id-token: write
      contents: read
    steps:
      # Step 1: Check out the repository code.
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Set Azure Credentials Environment Variables.
      # This step parses the AZURE_CREDENTIALS secret and sets environment variables
      # (ARM_CLIENT_ID, ARM_CLIENT_SECRET, ARM_TENANT_ID, ARM_SUBSCRIPTION_ID)
      # that the Terraform AzureRM provider uses for Service Principal authentication.
      - name: Set Azure Credentials Environment Variables
        run: |
          echo "ARM_CLIENT_ID=$(echo '${{ secrets.AZURE_CREDENTIALS }}' | jq -r .clientId)" >> $GITHUB_ENV
          echo "ARM_CLIENT_SECRET=$(echo '${{ secrets.AZURE_CREDENTIALS }}' | jq -r .clientSecret)" >> $GITHUB_ENV
          echo "ARM_TENANT_ID=$(echo '${{ secrets.AZURE_CREDENTIALS }}' | jq -r .tenantId)" >> $GITHUB_ENV
          echo "ARM_SUBSCRIPTION_ID=$(echo '${{ secrets.AZURE_CREDENTIALS }}' | jq -r .subscriptionId)" >> $GITHUB_ENV

      # Step 3: Setup Terraform.
      # This action installs a specific version of Terraform.
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
            terraform_version: 1.8.5
      # Step 4: Setup Terragrunt.
      # This step downloads and installs a specific version of the Terragrunt binary.
      - name: Setup Terragrunt
        run: |
          wget -O terragrunt_binary https://github.com/gruntwork-io/terragrunt/releases/download/v0.58.10/terragrunt_linux_amd64
          chmod +x terragrunt_binary
          sudo mv terragrunt_binary /usr/local/bin/

      # Step 5: Set Image Tag for Terragrunt
      # Sets the image tag from the dispatch event or defaults to 'latest' for other triggers.
      # This variable will be passed to Terraform.
      - name: Set Image Tag for Terragrunt
        run: |
          IMAGE_TAG=${{ github.event.client_payload.image_tag || 'latest' }}
          echo "TF_VAR_app_image_tag=$IMAGE_TAG" >> $GITHUB_ENV
          echo "Image tag set to: $IMAGE_TAG"

      # Step 6: Run Terragrunt Apply.
      # This command finds all terragrunt.hcl files and runs 'apply'.
      # It will use the TF_VAR_app_image_tag variable to configure the application version.
      - name: Terragrunt Apply
        id: apply
        run: /usr/local/bin/terragrunt_binary run-all apply --terragrunt-non-interactive -auto-approve
        
      # Step 7: Trigger Smoke Tests
      # After a successful deployment, this step triggers the smoke tests in the tests repository.
      - name: Trigger Smoke Tests
        if: steps.apply.outcome == 'success'
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.PAT_FOR_DISPATCH_TO_TESTS }} # Use a dedicated PAT for the tests repo
          repository: ${{ github.repository_owner }}/taskmanager-tests-java
          event-type: run-smoke-suite
          client-payload: |
            {
              "base_url": "https://staging.taskmanager.example.com"
            }